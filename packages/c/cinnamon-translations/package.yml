# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cinnamon-translations
version    : 6.8.2
release    : 10
source     :
    - https://github.com/linuxmint/cinnamon-translations/archive/refs/tags/6.8.2.tar.gz : 10e922c5181dd24846338d71f7c069e8a245a7be6c5b6c6bfa64607954021eed
