name       : cinnamon
version    : 6.8.4
release    : 1
source     :
    - https://github.com/linuxmint/cinnamon/archive/refs/tags/6.8.4.tar.gz : d9cf68046c5d115f38d18b734dbd2dfad53c67a861942282e17cdd4688b5cf8d
homepage   : https://projects.linuxmint.com/cinnamon/
license    : GPL-2.0-or-later
component  : desktop
summary    : A Linux desktop featuring a traditional layout, built from modern technology and introducing brand new innovative features.
description: |
    A Linux desktop featuring a traditional layout, built from modern technology and introducing brand new innovative features.
builddeps  :
    - pkgconfig(cjs-1.0)
    - pkgconfig(gbm)
    - pkgconfig(gcr-base-3)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(gtk4-layer-shell-0)
    - pkgconfig(libcinnamon-menu-3.0)
    - pkgconfig(libnm)
    - pkgconfig(libsecret-1)
    - pkgconfig(libxdo)
    - pkgconfig(muffin-clutter-x11-0)
    - pkgconfig(xapp)
    - python-libsass
rundeps    :
    - cinnamon-control-center
    - cinnamon-screensaver
    - cinnamon-session
    - cinnamon-settings-daemon
    - cinnamon-translations
    - clockenstein
    - gsound
    - ibus
    - keybinder
    - libcinnamon-desktop
    - nemo
    - python-pam
    - python-pexpect
    - python-pillow
    - python-psutil
    - python-setproctitle
    - python-tinycss2
    - python-xapp
    - touchegg
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
