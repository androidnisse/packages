# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : openmsx
version    : '22.0'
release    : 13
source     :
    - https://github.com/openMSX/openMSX/releases/download/RELEASE_22_0/openmsx-22.0.tar.gz : 
        f6d5ff89c62d32447dd5f731ff653d26a2a3c4ac6e86ea4f1bda3c4f8ad98c5d
homepage   : https://openmsx.org/
license    : GPL-2.0-or-later
component  : games.emulator
summary    : openMSX is an emulator for the MSX home computer system
description: |
    openMSX is an emulator for the MSX home computer system
builddeps  :
    - pkgconfig(SDL2_ttf)
    - pkgconfig(alsa)
    - pkgconfig(freetype2)
    - pkgconfig(glew)
    - pkgconfig(libpng)
    - pkgconfig(tcl)
    - pkgconfig(theora)
    - pkgconfig(vorbis)
    - pkgconfig(x11)
setup      : |
    sed -i 's@SYMLINK_FOR_BINARY:=true@SYMLINK_FOR_BINARY:=false@' build/custom.mk
    sed -i 's@INSTALL_BASE:=/opt/openMSX@INSTALL_BASE:=/usr/share/openmsx@' build/custom.mk
    echo 'INSTALL_DOC_DIR:=/usr/share/doc/openmsx' >> build/custom.mk
    echo 'INSTALL_SHARE_DIR:=/usr/share/openmsx' >> build/custom.mk
    echo 'INSTALL_BINARY_DIR:=/usr/bin' >> build/custom.mk

    %configure
build      : |
    %make
install    : |
    %make_install
    # Install icons, desktop file, and appstream metainfo
    install -dm00644 ${installdir}/usr/share/icons/hicolor
    for i in 16 32 48 128 256; do
        %install_file share/icons/openMSX-logo-$i.png "${installdir}/usr/share/icons/hicolor/${i}x$i/apps/org.openmsx.openMSX.png"
    done
    %install_file ${pkgfiles}/org.openmsx.openMSX.desktop -t ${installdir}/usr/share/applications/
    %install_file ${pkgfiles}/org.openmsx.openMSX.metainfo.xml -t ${installdir}/usr/share/metainfo/
    %install_license ${workdir}/doc/GPL.txt
