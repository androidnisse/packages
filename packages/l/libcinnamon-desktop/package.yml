# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libcinnamon-desktop
version    : 6.8.1
release    : 11
source     :
    - https://github.com/linuxmint/cinnamon-desktop/archive/refs/tags/6.8.1.tar.gz : 670f683d12930328b217d9b08aff69117bf1c0462079c970628770d2daba9e4a
homepage   : https://github.com/linuxmint/cinnamon-desktop
license    : LGPL-2.0-or-later
component  : desktop.library
summary    : The cinnamon-desktop library
description: |
    libcinnamon-desktop contains the libcinnamon-desktop library.
builddeps  :
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libpulse)
    - pkgconfig(xkbfile)
    - pkgconfig(xkeyboard-config)
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING COPYING.LIB
