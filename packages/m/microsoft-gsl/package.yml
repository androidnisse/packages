# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : microsoft-gsl
version    : 5.0.1
release    : 2
source     :
    - https://github.com/microsoft/GSL/archive/refs/tags/v5.0.1.tar.gz : 733a87a7eea56db075ee060735ba7616a27c1c55955f264d5473bf9e83294ad0
homepage   : https://github.com/microsoft/GSL
license    : MIT
component  : programming.library
summary    : Guidelines Support Library
description: |
    The Guidelines Support Library (GSL) contains functions and types that are suggested for use by the C++ Core Guidelines maintained by the Standard C++ Foundation
libsplit   : false
builddeps  :
    - gtest
setup      : |
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
check      : |
    %ninja_check
patterns   : /*
